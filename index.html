<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saurabh Shivakumar</title>
<meta name="description" content="Saurabh Shivakumar is a composer and performer based in London.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: light and clean, taken from the photo of Saurabh standing in the grass:
   pale sky paper, storm-blue titles, grass-green labels, near-black ink, the cream of the shirt.
   Home is that photo full-bleed with one endless line across the horizon and what's next underneath.
   Text pages sit beside a portrait; grid pages carry a portrait in the header. Light type weights,
   no effects. One deliberate light world, so every colour is set explicitly.
   Social icons: Font Awesome Free (CC BY 4.0), fontawesome.com. */
:root{
  --paper:#f3f3f6;
  --paper-2:#e8e8ef;
  --shirt:#e6e4da;
  --ink:#1a1a22;
  --ink-soft:rgba(26,26,34,.64);
  --sky:#4f5a8a;
  --lilac:#adafc5;
  --grass:#4b5e2a;
  --white:#fbfbf9;
  --line:rgba(26,26,34,.13);
  --sans:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter:clamp(16px,4.6vw,64px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{background:var(--paper);color:var(--ink);font:400 16.5px/1.6 var(--sans);margin:0;min-height:100%;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{max-width:100%}

/* ---------- home photograph ---------- */
.ground{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--paper);pointer-events:none}
.g{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .8s ease}
.g.on{opacity:1}
.shade,.grain,.credit{display:none}

/* ---------- header ---------- */
.bar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:1.4rem;padding:calc(env(safe-area-inset-top,0px) + clamp(1rem,2.2vw,1.8rem)) var(--gutter) .8rem}
body:not([data-look="home"]) .bar{position:relative;background:var(--paper)}
.mark{font:500 clamp(1.25rem,.95rem + 1vw,1.9rem)/1 var(--sans);letter-spacing:-.02em;text-decoration:none;white-space:nowrap;margin-right:auto;color:var(--ink)}
.mark:hover{color:var(--sky)}
.nav{display:flex;align-items:center;gap:clamp(1rem,1.8vw,1.9rem)}
.dd{position:relative}
.nav .top{display:inline-flex;align-items:center;gap:.3rem;font:400 1rem/1 var(--sans);text-decoration:none;padding:.55rem 0;border-bottom:1px solid transparent}
.nav .top svg{opacity:.5;transition:transform .2s}
.nav .top:hover,.dd:focus-within .top{color:var(--sky)}
.nav .top[aria-current="true"]{border-bottom-color:var(--ink)}
.sub{position:absolute;top:100%;left:-1rem;min-width:14.5rem;display:grid;padding:.45rem 0;background:var(--white);border:1px solid var(--line);box-shadow:0 10px 28px rgba(26,26,34,.08);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .18s,transform .18s,visibility .18s}
.dd:hover .sub,.dd:focus-within .sub{opacity:1;visibility:visible;transform:none}
.dd:hover .top svg{transform:rotate(180deg)}
.sub a{padding:.45rem 1rem;text-decoration:none;font-size:.95rem;color:var(--ink-soft)}
.sub a:hover,.sub a[aria-current="true"]{color:var(--ink);background:var(--paper)}
.sub a[aria-current="true"]{box-shadow:inset 2px 0 0 var(--sky)}
.icons{display:flex;align-items:center;gap:.85rem}
.icons a{display:grid;place-items:center;width:28px;height:28px;color:var(--ink);opacity:.85}
.icons a:hover{color:var(--sky);opacity:1}
.icons svg{width:18px;height:18px;fill:currentColor}
.burger{display:none;place-items:center;width:46px;height:46px;margin-right:-9px;color:var(--ink)}
@media (max-width:1080px){.bar .nav,.bar .icons{display:none}.burger{display:grid}}

main{position:relative;z-index:5;padding-inline:var(--gutter)}
body:not([data-look="home"]) main{min-height:70svh}
.page{padding-block:clamp(2rem,5vw,4rem) 3rem;max-width:1440px;margin-inline:auto}
footer{position:relative;z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem;max-width:calc(1440px + 2 * var(--gutter));margin-inline:auto;padding:2.4rem var(--gutter) calc(env(safe-area-inset-bottom,0px) + 2rem);font:400 .7rem/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border-top:1px solid var(--line)}
footer .icons svg{width:16px;height:16px}

/* ---------- shared type ---------- */
.title{font:300 clamp(2.8rem,1.6rem + 5.4vw,6.4rem)/.98 var(--sans);letter-spacing:-.04em;color:var(--sky);margin:0;text-wrap:balance}
.crumb{display:inline-block;font:400 .72rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--grass);text-decoration:none;margin-bottom:1rem}
.crumb:hover{color:var(--ink)}
.crumb::before{content:"← "}
.lead{font:400 clamp(1.08rem,.98rem + .45vw,1.32rem)/1.5 var(--sans);color:var(--ink-soft);max-width:44ch;margin:1.2rem 0 0}
.head{margin-bottom:clamp(2.4rem,5vw,4rem)}
.head.has-photo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,clamp(13rem,24vw,20rem));gap:1.6rem clamp(1.5rem,5vw,4rem);align-items:end}
.head-ph{margin:0}
.head-ph img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
@media (max-width:700px){.head.has-photo{grid-template-columns:minmax(0,1fr)}.head-ph{order:-1}.head-ph img{aspect-ratio:4/3}}
.next{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem 1.2rem;margin-top:clamp(3.5rem,8vw,6rem);padding-top:1.4rem;border-top:1px solid var(--line)}
.next span{font:400 .72rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--grass)}
.next a{font:300 clamp(1.8rem,1.2rem + 2.4vw,3.2rem)/1.05 var(--sans);letter-spacing:-.03em;text-decoration:none;color:var(--ink)}
.next a:hover{color:var(--sky)}
.sec{margin-top:clamp(3rem,7vw,5rem)}
.sec:first-of-type{margin-top:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1.2rem;margin-bottom:1.4rem;padding-bottom:.8rem;border-bottom:1px solid var(--line)}
.sec-head h2{margin:0;font:400 clamp(1.6rem,1.2rem + 1.6vw,2.5rem)/1.05 var(--sans);letter-spacing:-.025em;color:var(--ink)}
.sec-head h2 a{text-decoration:none}
.sec-head h2 a:hover{color:var(--sky)}
.sec-head .count{font:400 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.sec-head .open{margin-left:auto;font:400 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--grass)}
.sec-head .open:hover{color:var(--sky)}

/* ---------- side photo pages (about, events, contact) ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,clamp(16rem,32vw,30rem));gap:2rem clamp(2rem,6vw,5.5rem);align-items:start}
.side{margin:0;position:sticky;top:1.5rem}
.side img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}.side img{aspect-ratio:4/3}}

/* ---------- home ---------- */
.home{position:relative;min-height:min(100svh,1100px);background-color:var(--paper-2);background-size:cover;background-position:50% 62%;background-repeat:no-repeat;display:flex;flex-direction:column;justify-content:flex-end;margin-inline:calc(var(--gutter) * -1);padding-bottom:clamp(2rem,7svh,4.5rem)}
.marquee{overflow:hidden;padding-block:.05em .12em}
.mq-track{display:inline-flex;white-space:nowrap;animation:slide var(--mq-dur,80s) linear infinite;font:300 clamp(3.4rem,9vw,9.5rem)/1.05 var(--sans);letter-spacing:-.045em;color:var(--white)}
.mq-unit{padding-right:.45em;text-shadow:0 1px 24px rgba(26,26,34,.18)}
.mq-unit a{text-decoration:none}
.mq-unit a:hover{color:var(--lilac)}
.marquee:hover .mq-track{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.upnext{position:relative;z-index:5;background:var(--paper);margin-inline:calc(var(--gutter) * -1);padding:clamp(2rem,5vw,3.6rem) var(--gutter) clamp(1rem,3vw,2rem)}
.upnext-in{max-width:1440px;margin-inline:auto}
.upnext-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding-bottom:.8rem;margin-bottom:1.3rem;border-bottom:1px solid var(--line)}
.upnext-head h2{margin:0;font:300 clamp(1.8rem,1.3rem + 1.8vw,2.8rem)/1 var(--sans);letter-spacing:-.03em;color:var(--sky)}
.upnext-head a{font:400 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--grass)}
.upnext-head a:hover{color:var(--sky)}
.up-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4rem clamp(1rem,2.4vw,2.2rem)}
.up-list li{min-width:0;padding-top:.2rem}
.up-list .d{display:block;font:400 .72rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--grass);margin-bottom:.35rem}
.up-list .v{display:block;font:500 1.06rem/1.3 var(--sans);color:var(--ink)}
.up-list .w{display:block;font-size:.93rem;line-height:1.45;color:var(--ink-soft);margin-top:.2rem}
@media (max-width:900px){.up-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.up-list{grid-template-columns:minmax(0,1fr)}}

/* ---------- about ---------- */
.prose{font-size:1.05rem;max-width:62ch}
.prose p{margin:0 0 1.05em}
.prose p:first-child{font:400 clamp(1.18rem,1.02rem + .6vw,1.45rem)/1.45 var(--sans);color:var(--ink)}
.prose a{text-decoration-color:var(--lilac);text-underline-offset:3px}
.prose a:hover{color:var(--sky)}
.cv{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.cv li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem 1.4rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.cv b{font:500 1.08rem/1.3 var(--sans);color:var(--ink)}
.cv .y{font:400 .74rem/1.6 var(--mono);letter-spacing:.08em;color:var(--grass);white-space:nowrap}
.cv .o{grid-column:1/-1;color:var(--ink-soft);font-size:.96rem}
.with{font-size:1.04rem;color:var(--ink-soft);max-width:60ch;margin:0}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16.5rem),1fr));gap:clamp(1.8rem,3vw,2.6rem) clamp(1rem,2vw,1.5rem)}
.tile{display:grid;gap:.65rem;text-decoration:none;min-width:0;align-content:start}
.frame{display:block;overflow:hidden;background:var(--paper-2)}
.frame canvas{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:3/2;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.tile:hover canvas,.entry:hover canvas{transform:scale(1.035)}
.tile .t{font:500 1.12rem/1.25 var(--sans);color:var(--ink);text-wrap:balance}
.tile .m{font:400 .7rem/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.tile:hover .t{color:var(--sky)}

/* ---------- entries (sub-pages) ---------- */
.entries{display:grid;gap:clamp(2.4rem,5vw,3.6rem)}
.entry{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:1.2rem clamp(1.4rem,4vw,3rem);align-items:start;padding-top:clamp(2rem,4vw,3rem);border-top:1px solid var(--line)}
.entry:first-child{border-top:0;padding-top:0}
.entry .frame{text-decoration:none}
.entry h3{margin:0 0 .35rem;font:400 clamp(1.5rem,1.1rem + 1.4vw,2.3rem)/1.1 var(--sans);letter-spacing:-.025em;color:var(--ink);text-wrap:balance}
.entry h3 a{text-decoration:none}
.entry h3 a:hover{color:var(--sky)}
.entry .y{font:400 .74rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--grass);margin:0 0 .9rem}
.entry dl{display:grid;gap:.6rem;margin:0}
.entry dl div{display:grid;grid-template-columns:6.5rem minmax(0,1fr);gap:1rem}
.entry dt{font:400 .7rem/1.75 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.entry dd{margin:0}
.entry .note{margin:.9rem 0 0;color:var(--ink-soft);max-width:52ch}
@media (max-width:760px){.entry{grid-template-columns:minmax(0,1fr)}.entry dl div{grid-template-columns:minmax(0,1fr);gap:0}}

/* ---------- playing ---------- */
.collage{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(.6rem,1.4vw,1.1rem);margin:0 0 clamp(3rem,7vw,5.5rem);align-items:start}
.ph{margin:0;position:relative;min-width:0}
.ph img{display:block;width:100%;height:auto}
.ph figcaption{font:400 .64rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:.45rem}
.ph.a{grid-column:1/span 7;grid-row:1}
.ph.b{grid-column:8/span 5;grid-row:1/span 2;margin-top:10%}
.ph.c{grid-column:2/span 3;grid-row:2;margin-top:6%}
.ph.d{grid-column:5/span 3;grid-row:2;margin-top:14%}
.ph.e{grid-column:5/span 4;grid-row:3;margin-top:-2%}
@media (max-width:760px){.ph.a,.ph.b,.ph.c,.ph.d,.ph.e{grid-row:auto;margin-top:0}.ph.a,.ph.e{grid-column:1/span 12}.ph.b,.ph.d{grid-column:1/span 6}.ph.c{grid-column:7/span 6}}
.rows{list-style:none;margin:0;padding:0}
.rows li{border-bottom:1px solid var(--line)}
.rows a{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:.4rem 1.4rem;padding:.9rem 0;text-decoration:none}
.rows .n{font:300 clamp(1.4rem,1rem + 1.6vw,2.3rem)/1.12 var(--sans);letter-spacing:-.02em;color:var(--ink);transition:color .2s}
.rows .r{font:400 .7rem/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);text-align:right;max-width:24rem}
.rows a:hover .n{color:var(--sky)}
@media (max-width:640px){.rows a{grid-template-columns:minmax(0,1fr)}.rows .r{text-align:left}}

/* ---------- events ---------- */
.events{display:grid;grid-template-columns:minmax(0,1fr);gap:2.6rem}
.ev{margin:0 0 1.4rem;max-width:50ch}
.ev .d{display:block;font:400 .72rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--grass);margin-bottom:.25rem}
.ev .v{display:block;font:500 1.1rem/1.3 var(--sans);color:var(--ink)}
.ev .w{display:block;color:var(--ink-soft);font-size:.98rem;margin-top:.15rem}
.year{display:grid;grid-template-columns:minmax(0,7rem) minmax(0,1fr);gap:1rem clamp(1.5rem,4vw,3rem);padding:1.6rem 0;border-top:1px solid var(--line)}
.year h2{margin:0;font:300 clamp(2rem,1.5rem + 2vw,3.2rem)/1 var(--sans);letter-spacing:-.04em;color:var(--sky)}
.year-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr));gap:.4rem 2rem}
@media (max-width:760px){.year{grid-template-columns:minmax(0,1fr)}}

/* ---------- detail ---------- */
.hero{margin:0 0 1.6rem;background:var(--paper-2)}
.hero canvas{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:16/7}
.hero::after{content:none}
.detail-title{margin-bottom:clamp(1.8rem,4vw,3rem)}
@media (max-width:640px){.hero canvas{aspect-ratio:4/3}}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:2rem clamp(2rem,6vw,5rem);align-items:start}
.meta{display:grid;gap:1.1rem;margin:0}
.meta div{display:grid;gap:.2rem}
.meta dt{font:400 .72rem/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--grass)}
.meta dd{margin:0;font-size:1.06rem}
.big-note{font:300 clamp(1.25rem,1rem + .8vw,1.6rem)/1.42 var(--sans);margin:0;max-width:38ch}
.watch{display:inline-flex;align-items:center;gap:.65rem;margin-top:1.4rem;padding:.85rem 1.15rem;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font:400 .76rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.watch:hover{background:var(--ink);color:var(--white)}
@media (max-width:760px){.detail{grid-template-columns:minmax(0,1fr)}}

/* ---------- contact ---------- */
.contact{display:grid;gap:3rem}
.contact p{margin:0 0 1rem;max-width:48ch;color:var(--ink-soft);font-size:1.06rem}
.email{display:block;font:300 clamp(1.4rem,.7rem + 2.2vw,2.7rem)/1.15 var(--sans);letter-spacing:-.025em;overflow-wrap:break-word;user-select:all;color:var(--sky)}
.copy{margin-top:1.1rem;font:400 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:.7rem 1rem;border:1px solid var(--ink)}
.copy:hover{background:var(--ink);color:var(--white)}
.elsewhere{list-style:none;margin:0;padding:0;display:grid;gap:.15rem;border-top:1px solid var(--line)}
.elsewhere li{border-bottom:1px solid var(--line)}
.elsewhere a{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem 1rem;padding:.7rem 0;text-decoration:none;font:300 clamp(1.4rem,1.1rem + 1.2vw,2.1rem)/1.2 var(--sans);letter-spacing:-.02em}
.elsewhere svg{width:.75em;height:.75em;fill:currentColor}
.elsewhere small{font:400 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.elsewhere a:hover{color:var(--sky)}

/* ---------- menu (narrow screens) ---------- */
.menu{position:fixed;inset:0;z-index:50;overflow-y:auto;background:var(--paper);color:var(--ink);padding:calc(env(safe-area-inset-top,0px) + clamp(1rem,2.2vw,1.8rem)) var(--gutter) calc(env(safe-area-inset-bottom,0px) + 2rem)}
.menu::before{content:none}
.menu-top{display:flex;justify-content:space-between;align-items:center}
.menu .x{width:52px;height:52px;margin-right:-10px;font:300 2rem/1 var(--sans);color:var(--ink)}
.menu-pages{display:grid;gap:1.3rem;margin-top:1.8rem}
.menu-pages .big{font:300 clamp(2.6rem,1.6rem + 6vw,5rem)/1 var(--sans);letter-spacing:-.04em;text-decoration:none;color:var(--sky)}
.menu-pages .subs{display:flex;flex-wrap:wrap;gap:.2rem 1.2rem;margin-top:.5rem}
.menu-pages .subs a{font:400 .74rem/1.7 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink-soft)}
.menu a:hover{color:var(--grass)}
.menu .icons{margin-top:2.4rem;gap:1.3rem}
.menu .icons svg{width:24px;height:24px}

@media (prefers-reduced-motion:reduce){
  .mq-track{animation:none;white-space:normal;display:block}
  .mq-track .dup{display:none}
  .frame canvas,.g{transition:none}
}

/* Variant: sage. Closest to zahrah-hutton.com: sage ground, green wordmark, rust titles, indigo captions,
   cream line running across the photograph. */
:root{--paper:#bfd2be;--paper-2:#b2c7b1;--white:#eef4e9;--shirt:#eef4e9;--ink:#1d211b;--ink-soft:rgba(29,33,27,.72);--sky:#b5602b;--grass:#3c5a38;--lilac:#424872;--line:rgba(29,33,27,.2);--sans:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif}
.mark{font-weight:600;color:#587755}
.mark:hover{color:var(--ink)}
.title{font-weight:500;letter-spacing:-.035em}
.sec-head h2,.next a,.rows .n,.entry h3,.upnext-head h2,.year h2,.menu-pages .big{font-weight:500}
.tile{text-align:center}
.tile .t{color:#424872;font-weight:400;font-size:1.15rem}
.rows .n,.entry h3,.cv b,.up-list .v,.ev .v{color:#424872}
.home .mq-track{font-weight:600;color:rgba(246,251,216,.92);letter-spacing:-.035em}
.mq-unit{text-shadow:none}
.mq-unit a:hover{color:#fff}
.sub{background:var(--white)}
.sub a:hover,.sub a[aria-current="true"]{background:var(--paper)}
.menu-pages .big{color:var(--ink)}

/* final: plain page headings in the bar, back button on every page, role words in their own colour */
.nav .top{font-size:1.02rem}
.home .mq-unit a{color:#cfd2f7;transition:color .25s}
.home .mq-unit a:hover{color:#f2a15f}
.backbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem;margin:0 0 clamp(1.4rem,3vw,2.2rem)}
.back{display:inline-flex;align-items:center;gap:.45rem;font:500 .95rem/1 var(--sans);padding:.55rem .9rem .55rem .75rem;border:1px solid var(--line);background:var(--white);color:var(--ink)}
.back:hover{border-color:var(--ink);background:var(--ink);color:var(--white)}
.backbar .path{font:400 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.crumb{display:none}
.menu-pages{gap:.4rem}
.menu-pages .big{display:block}
.frame{background:#2b302a}

/* v5: two-line home, projects, photo grid */
.marquee2{overflow:hidden;padding-block:.15rem .2rem}
.mq2-track{display:inline-flex;white-space:nowrap;animation:slide var(--mq2-dur,60s) linear infinite reverse;font:400 clamp(1.05rem,.8rem + 1vw,1.6rem)/1.3 var(--sans);color:rgba(246,251,216,.95)}
.mq2-unit{display:inline-flex;align-items:baseline;gap:.8em;padding-right:1.6em}
.mq2-unit b{font-weight:500;color:#cfd2f7;margin-right:.15em}
.mq2-unit a{text-decoration:none;color:inherit;transition:color .25s}
.mq2-unit a:hover{color:#f2a15f}
.mq2-unit i{font-style:normal;opacity:.55}
.marquee2:hover .mq2-track{animation-play-state:paused}
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(.5rem,1vw,.9rem);margin:0 0 clamp(3rem,6vw,5rem)}
.pgrid figure{margin:0;min-width:0}
.pgrid img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
.pgrid figcaption{font:400 .64rem/1.35 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin-top:.45rem}
@media (max-width:640px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile .frame img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.tile:hover .frame img{transform:scale(1.035)}
.pgrid-cards .tile .m{order:0}
.pj-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.pj-photos figure{margin:0;min-width:0}
.pj-photos img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
.pj-canvas canvas{aspect-ratio:3/2}
.rel{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.6rem}
.rel .watch{margin-top:0}


/* v7: about at top, roomier heading, darker role words, dice line + upcoming at the foot */
:root{--hover:#2f4a2c;--leaf:#c9e4b5;--role:#9fd37f}
.home .mq-track{color:var(--mq-ink,#f6fbd8)}
.home{background-position:50% 45%}
.home-top{position:absolute;left:0;right:0;top:calc(var(--bar-h,5rem) + clamp(.4rem,1.6vw,1.2rem));z-index:2;padding-inline:var(--gutter)}
.ht-about{max-width:40ch}
.ht-about p{margin:0 0 .7rem;font:400 clamp(1rem,.9rem + .35vw,1.18rem)/1.5 var(--sans);color:var(--ink)}
.ht-about a{font:500 .9rem/1 var(--sans);color:var(--hover);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.ht-about a:hover{color:var(--ink)}
.home .marquee{padding-block:.08em .16em}
.home .mq-track{letter-spacing:-.012em;line-height:1.12}
.home .mq-unit{padding-right:.7em}
.home .mq-unit .roles{white-space:nowrap}
.home .mq-unit a{color:var(--role);transition:color .25s}
.home .mq-unit a:hover{color:#ffffff}
.home-foot{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:1rem 3rem;padding-inline:var(--gutter);margin-top:clamp(.5rem,1.4vw,1rem)}
.cheeky span{display:block}
.home-foot,.ht-about{text-shadow:none}
.home-foot{text-shadow:0 1px 3px rgba(18,28,14,.35),0 1px 14px rgba(18,28,14,.45)}
.cheeky{margin:0;max-width:44ch;font:400 clamp(1.02rem,.85rem + .7vw,1.4rem)/1.35 var(--sans);color:#f6fbd8}
.cheeky a{color:var(--leaf);text-decoration:none;border-bottom:1px solid currentColor;transition:color .25s}
.cheeky a:hover{color:#f6fbd8}
.ht-up{color:#f6fbd8;max-width:20rem;text-align:right}
.ht-up h2{margin:0 0 .45rem;font:500 .74rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#e2f2d4}
.ht-up ol{list-style:none;margin:0 0 .55rem;padding:0;display:grid;gap:.4rem}
.ht-up .d{display:block;font:400 .66rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#f6fbd8;opacity:.9}
.ht-up .v{display:block;font:500 .96rem/1.3 var(--sans);color:#f6fbd8}
.ht-up > a{font:500 .86rem/1 var(--sans);color:var(--leaf);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.ht-up > a:hover{color:#f6fbd8}
.nav .top:hover,.tile:hover .t,.rows a:hover .n,.entry h3 a:hover,.sec-head h2 a:hover,.next a:hover,.elsewhere a:hover,.prose a:hover,.icons a:hover,.sec-head .open:hover,.mark:hover,.menu a:hover{color:var(--hover)}
.watch:hover,.back:hover,.copy:hover{background:var(--hover);border-color:var(--hover);color:#f6fbd8}
@media (max-width:760px){
  .ht-about p{font-size:.95rem}
  .home-foot{gap:1rem;align-items:flex-start}
  .cheeky{flex:1 1 50%;font-size:.95rem;line-height:1.35}
  .cheeky span{display:inline}
  .ht-up{flex:1 1 46%;max-width:none}
  .ht-up ol{gap:.3rem;margin-bottom:.45rem}
  .ht-up .v{font-size:.86rem}
  .ht-up h2{margin-bottom:.35rem}
  .ht-up > a{font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){
  .home .mq-track{font-size:clamp(1.6rem,7vw,7.5rem)}
  .home .mq-unit{display:block;padding-inline:var(--gutter)}
  .home .mq-track .dup{display:none}
  .home .mq-unit .who,.home .mq-unit .roles{display:block}
}

/* v8: menu always at the top (no burger), projects dropdown */
.burger{display:none!important}
.bar{flex-wrap:wrap}
.dd{display:inline-flex;align-items:center;gap:0}
.dd-btn{display:grid;place-items:center;width:18px;height:34px;padding:0;margin:0 -.2rem 0 .15rem;background:none;border:0;color:inherit;cursor:pointer;opacity:.65}
.dd-btn:hover{opacity:1;color:var(--hover)}
.dd-btn svg{transition:transform .2s}
.dd:hover .dd-btn svg,.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd.open .sub{opacity:1;visibility:visible;transform:none}
@media (hover:none){.dd:hover .sub,.dd:focus-within .sub{opacity:0;visibility:hidden;transform:translateY(-4px)}.dd.open .sub{opacity:1;visibility:visible;transform:none}.dd:hover .dd-btn svg{transform:none}.dd.open .dd-btn svg{transform:rotate(180deg)}}
.sub{z-index:30;min-width:11.5rem;top:calc(100% - .1rem)}
.sub a{font-size:.95rem;color:var(--ink)}
.sub a:last-child{border-top:1px solid var(--line);margin-top:.3rem;padding-top:.6rem;font:400 .7rem/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.sub a:hover,.sub a[aria-current="true"]{color:var(--hover);background:var(--paper)}
.sub a[aria-current="true"]{box-shadow:inset 2px 0 0 var(--hover)}
.nav .top[aria-current="true"]{border-bottom-color:currentColor}
.dd:focus-within .top,.dd.open .top,.dd:hover .top{color:var(--hover)}
.pj-feat{margin-bottom:clamp(2.5rem,5vw,4rem)}
.bar .nav{gap:clamp(1.1rem,1.6vw,1.7rem)}
.bar > .icons{gap:.75rem;margin-left:clamp(.4rem,1vw,1rem)}
.bar .icons a,.nav .top{height:34px}
.nav .top{padding:0}
.nav .top[aria-current="true"]{box-shadow:inset 0 -1px 0 currentColor;border-bottom-color:transparent}
@media (max-width:1080px){
  .bar{column-gap:1.2rem;row-gap:0;padding-bottom:.5rem}
  .bar .mark{flex-basis:100%;margin-bottom:.4rem}
  .bar .nav{display:contents}
  .bar > .icons{display:flex;margin-left:auto;gap:.65rem}
  .bar .icons a{width:24px;height:34px}
  .bar .icons svg{width:17px;height:17px}
}
@media (max-width:600px){
  .bar{column-gap:.95rem}
  .nav .top{font-size:.97rem}
  .bar > .icons{gap:.45rem}
  .bar .icons a{width:22px}
  .bar .icons svg{width:15px;height:15px}
  .sub{left:auto;right:-.4rem}
}
/* landscape: keep the foot compact (date and venue on one line) so the photo needs to move up less */
@media (min-aspect-ratio:1/1){
  .home{padding-bottom:clamp(1.1rem,3svh,2rem)}
  .home-foot{margin-top:clamp(.3rem,.8vw,.7rem)}
  .ht-up ol{gap:.3rem;margin-bottom:.5rem}
  .ht-up li{display:flex;justify-content:flex-end;align-items:baseline;gap:.7rem}
  .ht-up .d{display:inline}
}
/* v9: header sits lower; heading footnote */
.bar{padding-top:calc(env(safe-area-inset-top,0px) + clamp(1.6rem,3.3vw,2.9rem))}
.home .mq-unit .ast{color:var(--mq-ink,#f6fbd8);margin-left:.02em}
.home-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"note up" "dice up";column-gap:3rem;row-gap:.85rem;align-items:end}
.home-foot .note{grid-area:note;margin:0;max-width:46ch;font:400 clamp(.88rem,.8rem + .25vw,1.02rem)/1.45 var(--sans);color:#f6fbd8}
.home-foot .note .ast{color:var(--mq-ink,#f6fbd8);margin-right:.2em}
.home-foot .cheeky{grid-area:dice}
.home-foot .ht-up{grid-area:up;align-self:end}
@media (max-width:760px){
  .home-foot{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"note note" "dice up";column-gap:1rem;row-gap:.75rem}
  .home-foot .note{font-size:.84rem;max-width:none}
  .home-foot .cheeky{align-self:start}
  .home-foot .ht-up{align-self:start}
}

/* v10: home looks set their own colours */
.home{position:relative}
.photo-credit{position:absolute;z-index:2;right:var(--gutter);bottom:clamp(.35rem,1svh,.7rem);margin:0;font:400 .62rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--foot-ink);opacity:.85}
.home{padding-bottom:calc(clamp(1.1rem,3svh,2rem) + 1.1rem)!important}
body:not([data-look="home"]) .bar .mark{color:var(--page-mark,#587755)}

.home .mq-unit{text-shadow:var(--mq-shadow,none)}
.home .mq-unit a{color:var(--role)}
.home .mq-unit a:hover{color:var(--role-hover,#fff)}
.home-foot{text-shadow:none}
.home-foot .note,.cheeky,.ht-up,.ht-up .v,.ht-up .d{color:var(--foot-ink)}
.cheeky a,.ht-up > a,.ht-up h2{color:var(--foot-accent)}
.cheeky a:hover,.ht-up > a:hover{color:var(--foot-ink)}
body[data-look="home"] .bar .mark{color:var(--name-ink,var(--mq-ink))}

body[data-look="home"] .nav .top,body[data-look="home"] .dd-btn,body[data-look="home"] .bar .icons a{color:var(--foot-ink)}
body[data-look="home"] .nav .top:hover,body[data-look="home"] .dd:hover .top,body[data-look="home"] .dd.open .top,body[data-look="home"] .bar .icons a:hover,body[data-look="home"] .mark:hover{color:var(--role)}

const ABOUT=`
<p>Saurabh Shivakumar is a composer, guitarist and improviser based in London. He is a PhD candidate at the Royal Academy of Music, co-supervised by Rubens Askenar and Alex Hills, and the Academy’s Manson Fellow for 2026–27.</p>
<p>Originally from Chennai and raised in Singapore, he makes music between notation, improvisation and live electronics. His recent work keeps returning to grief, and to feedback systems: electric guitar pushed into feedback, modular synths, and Max/MSP patches that answer the players back. Many of his pieces give performers real agency, treating the score as a set of conditions to work inside. In <a href="#w-see-it-say-it"><i>See it. Say it. Saurabh.</i></a>, a map of the London Underground becomes a graphic score that drives the electronics.</p>
<p>He won The Musicians’ Company Priaulx Rainier Composition Prize in 2026 and was a Southbank Centre Future Artist in 2025. His music has been performed by Riot Ensemble, The Hermes Experiment, CHROMA and Fin du Temps Ensemble. He arranges and orchestrates for the City of Birmingham Symphony Orchestra, including for the BBC Proms, and for the Sultan Stevenson Jazz Orchestra.</p>
<p>As a performer he plays in the improvising duo Red on Gold with singer and electronic musician Anastasija Stanojevic, is a member of [flux] ensemble, Musarc and the New London Chamber Choir, and is a founding member of the London Bollywood Orchestra. He has performed at LSO St Luke’s, Music We’d Like to Hear, The Eternal Series and the 840 series. Recent collaborators include Phaedra Ensemble, Neil Luck, Ushara Dilrukshan and Ashkan Layegh. He has also made work with art at The Courtauld Gallery and curated at Palestine House.</p>
<p>Saurabh trained as a jazz guitarist at Trinity Laban Conservatoire of Music and Dance before moving into composition, completing his MMus at the Royal Academy of Music in 2026. His doctoral research looks at experimental, improvised and electronic practices within composition. He teaches Digital Musicianship and Composition at Junior Trinity and is a programme tutor for first-year undergraduates at Trinity Laban.</p>`;

const loaded={};
function loadImg(k){return loaded[k]||(loaded[k]=new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=IMG[k]}))}
const duoCache={};
function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
async function duotone(src,pal){
  const key=src+pal;if(duoCache[key])return duoCache[key];
  return duoCache[key]=(async()=>{
    const im=await loadImg(src);if(!im)return null;
    const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext("2d");x.drawImage(im,0,0);
    const d=x.getImageData(0,0,c.width,c.height),p=d.data,[a,b]=PAL[pal].map(hexRGB);
    for(let i=0;i<p.length;i+=4){let l=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)/255;l=l<.5?2*l*l:1-2*(1-l)*(1-l);l=.15+l*.85;
      p[i]=a[0]+(b[0]-a[0])*l;p[i+1]=a[1]+(b[1]-a[1])*l;p[i+2]=a[2]+(b[2]-a[2])*l}
    x.putImageData(d,0,0);return c;
  })();
}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function alpha(hex,a){const [r,g,b]=hexRGB(hex);return `rgba(${r},${g},${b},${a})`}
const C={cream:"#fbf9ee",sage:"#d3e6cf",rust:"#ffd2a3",indigo:"#d8dbff",gold:"#fbe6a6",ink:"#1d211b"};

async function paint(cv,item,pal){
  const W=cv.width,H=cv.height,x=cv.getContext("2d"),r=rng(hash(item.s||item.t));
  x.fillStyle="#2b302a";x.fillRect(0,0,W,H);
  const list=FILM[pal]||FILM.play,im=await loadImg(list[hash(item.s)%list.length]);
  if(im){const sc=1+r()*.6,sw=im.naturalWidth/sc,sh=Math.min(im.naturalHeight,sw*H/W),sx=r()*(im.naturalWidth-sw),sy=r()*(im.naturalHeight-sh);x.drawImage(im,sx,sy,sw,sh,0,0,W,H)}
  x.save();x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=W/240;marks(x,W,H,item,r);x.restore();
}
function marks(c,W,H,item,r){
  const s=W/720,k=item.k;c.lineCap="round";c.lineJoin="round";
  if(k==="orch"){const L=18+(r()*10|0);for(let i=0;i<L;i++){const y=H*(.14+.72*i/(L-1)),amp=H*.016*(1+r()*2.4),f=(1+r()*3)*Math.PI*2/W,ph=r()*6;
      c.strokeStyle=alpha(r()<.18?C.rust:C.cream,.3+.6*r());c.lineWidth=.85*(1+r()*2)*s;c.beginPath();
      for(let X=0;X<=W;X+=5){const yy=y+amp*Math.sin(f*X+ph)*Math.sin(Math.PI*X/W);X?c.lineTo(X,yy):c.moveTo(X,yy)}c.stroke()}}
  else if(k==="ens"){const n=item.n||4,cols=[C.cream,C.rust,C.sage,C.indigo,C.cream,C.gold];
    for(let i=0;i<n;i++){const y=n===1?H/2:H*(.2+.6*i/(n-1));let X=W*.07;c.strokeStyle=c.fillStyle=cols[i%cols.length];
      while(X<W*.93){const len=Math.min(W*(.03+r()*.17),W*.93-X);
        if(r()<.7){c.lineWidth=.85*(3+r()*8)*s;c.beginPath();c.moveTo(X,y);c.lineTo(X+len,y);c.stroke()}else{c.beginPath();c.arc(X+3*s,y,(2.5+r()*3)*s,0,7);c.fill()}
        X+=len+W*(.015+r()*.06)}}}
  else if(k==="voice"){for(let i=0;i<4;i++){const x0=W*.07,y0=H*(.25+.5*r()),x1=W*.93,y1=H*(.2+.6*r());
      c.strokeStyle=alpha(i?C.cream:C.rust,.6+.4*r());c.lineWidth=.85*(1.5+r()*5)*s;c.beginPath();c.moveTo(x0,y0);c.bezierCurveTo(W*(.3+.2*r()),H*r(),W*(.5+.2*r()),H*r(),x1,y1);c.stroke();
      c.fillStyle=c.strokeStyle;c.beginPath();c.arc(x0,y0,5*s,0,7);c.fill()}}
  else if(k==="elec"){const f1=(6+r()*10)*Math.PI*2/W,f2=(20+r()*30)*Math.PI*2/W,ph=r()*6;
    for(let l=0;l<6;l++){c.strokeStyle=alpha(l===0?C.rust:C.cream,l===0?.95:.16+.1*l);c.lineWidth=.85*(l===0?2.4:1.2)*s;c.beginPath();
      for(let X=0;X<=W;X+=2){const t=X/W,amp=H*.38*Math.pow(t,1.3+l*.35),yy=H/2+amp*(Math.sin(X*f1+ph+l*.5)*.72+Math.sin(X*f2+l)*.28);X?c.lineTo(X,yy):c.moveTo(X,yy)}c.stroke()}}
  else if(k==="tube"){const cols=[C.rust,C.indigo,C.cream,C.sage,C.gold],dirs=[[1,0],[1,1],[1,-1],[0,1],[0,-1]],st=[];
    cols.forEach(col=>{let X=W*(.04+.08*r()),Y=H*(.15+.7*r());const pts=[[X,Y]];
      for(let j=0;j<6;j++){const d=dirs[r()*dirs.length|0],len=W*(.08+.14*r());X=Math.min(W*.96,Math.max(W*.04,X+d[0]*len));Y=Math.min(H*.88,Math.max(H*.12,Y+d[1]*len*(d[0]?1:.8)));pts.push([X,Y])}
      c.strokeStyle=col;c.lineWidth=.85*10*s;c.beginPath();pts.forEach((p,q)=>q?c.lineTo(...p):c.moveTo(...p));c.stroke();pts.forEach((p,q)=>{if(q&&r()<.5)st.push(p)})});
    st.forEach(p=>{c.fillStyle=C.cream;c.strokeStyle=C.ink;c.lineWidth=.85*3.5*s;c.beginPath();c.arc(p[0],p[1],8*s,0,7);c.fill();c.stroke()})}
  else if(k==="dance"){for(let i=0;i<7;i++){const cx=W*(.3+.4*r()),cy=H*(.35+.3*r()),rx=W*(.06+.3*r()),ry=rx*(.3+.7*r()),a0=r()*Math.PI*2;
      c.strokeStyle=alpha(i%3===0?C.rust:i%3===1?C.cream:C.gold,.55+.45*r());c.lineWidth=.85*(1.5+r()*4)*s;c.beginPath();c.ellipse(cx,cy,rx,ry,r()*Math.PI,a0,a0+(.5+1.3*r())*Math.PI);c.stroke()}
    c.fillStyle=C.cream;c.beginPath();c.arc(W*(.3+.4*r()),H*(.3+.4*r()),7*s,0,7);c.fill()}
  else if(k==="duo"){[[C.rust,0],[C.cream,1.7]].forEach(([col,ph],i)=>{const f=(2+i*.7)*Math.PI*2/W;c.strokeStyle=col;c.lineWidth=.85*6*s;c.beginPath();

  else if(k==="choir"){for(let a=0;a<4;a++)for(let b=0;b<16;b++){const X=W*(.1+.8*b/15),Y=H*(.25+.5*a/3),rad=(2+r()*9)*s;
      c.fillStyle=alpha(a===1&&r()<.3?C.rust:C.cream,.4+.6*r());c.beginPath();c.arc(X,Y,rad,0,7);c.fill()}}
  else if(k==="band"){const cols=[C.rust,C.cream,C.sage,C.indigo];for(let i=0;i<18;i++){const X=W*(.08+.84*i/17),h=H*(.12+.6*r());c.fillStyle=cols[i%4];c.fillRect(X-W*.011,H*.84-h,W*.022,h)}}

      c.strokeStyle=alpha(i%3?C.sage:C.rust,.85);c.lineWidth=.85*(1.5+r()*3)*s;c.beginPath();c.arc(X+W*.025,H*.52,W*(.02+.04*r()),Math.PI*1.1,Math.PI*1.9);c.stroke()}}
  else if(k==="rothko"){[["#7a2418",.82],["#a8381f",.74],["#4a1410",.86]].forEach(([col,a],i)=>{const X=W*(.1+i*.28+.02*r()),w=W*(.2+.03*r()),Y=H*(.14+.04*r()),h=H*(.7-.05*r());
      for(let g=0;g<12;g++){c.fillStyle=alpha(col,a*.1);c.fillRect(X-g*1.3*s,Y-g*1.3*s,w+g*2.6*s,h+g*2.6*s)}c.fillStyle=alpha(col,a);c.fillRect(X,Y,w,h)})}

/* the photo is 2000×2429. Around 72% of the way down sits a darker band (his trousers, the deepest blue of the sky, the
   first of the grass), where light type reads clearly; his head starts at 39.5%. Landscape screens slide the photo up so
   that band sits behind the heading (the dice line and upcoming stay underneath it), and let the section grow a little
   on short screens so his head never runs into the menu. Portrait screens (photo fills the height) lift the heading onto
   the band instead. The photo itself is never altered. */
function placeHome(){
  const sec=view.querySelector(".home"),L=window.HOME_LOOK;if(!sec||!L)return;
  const mq=sec.querySelector(".marquee");
  mq.style.marginBottom="0px";sec.style.minHeight="";sec.style.backgroundPosition=`${L.fx}% 50%`;
  const landscape=innerWidth>innerHeight,band=landscape?L.band:L.bandP;
  const measure=()=>{const sr=sec.getBoundingClientRect(),mr=mq.getBoundingClientRect();
    return {sr,W:sr.width,H:sr.height,centre:(mr.top+mr.bottom)/2-sr.top,mtop:mr.top-sr.top}};
  const dhOf=m=>L.h*Math.max(m.W/L.w,m.H/L.h);
  const barB=()=>document.querySelector(".bar").getBoundingClientRect().bottom-sec.getBoundingClientRect().top;
  let m=measure(),dh=dhOf(m);
  if(dh>m.H+2){
    /* grow the section only when his head would otherwise run into the menu */
    const p0=Math.min(1,Math.max(0,(band*dh-m.centre)/(dh-m.H))),headY=(m.H-dh)*p0+L.head*dh,gap=barB()+18-headY;
    if(gap>0){const need=Math.ceil(barB()+18+(band-L.head)*dh+(m.H-m.centre));if(need>m.H&&need<m.H*1.25){sec.style.minHeight=need+"px";m=measure();dh=dhOf(m)}}
    if(dh>m.H+2){let p=Math.min(1,Math.max(0,(band*dh-m.centre)/(dh-m.H)));
      /* never let the photo slide so far up that his head goes under the menu */
      const pHead=(L.head*dh-(barB()+24))/(dh-m.H);p=Math.max(0,Math.min(p,pHead));sec.style.backgroundPosition=`${L.fx}% ${(p*100).toFixed(2)}%`}
  }
  m=measure();dh=dhOf(m);
  const yOff=dh>m.H?(m.H-dh)*(parseFloat(sec.style.backgroundPosition.split(" ")[1])/100):0;
  const target=yOff+band*dh;
  if(m.centre>target+4){const room=m.mtop-(barB()+16);mq.style.marginBottom=Math.max(0,Math.min(m.centre-target,room))+"px"}
}

function parentOf(h){
  const [base,sub]=h.split(/-(.+)/);
  if(base==="about")return sub?["about","about / "+(sub==="awards"?"awards & education":"teaching & curation")]:["","about"];
  if(base==="composer")return sub?["composer","composer / "+lab(CATS,sub)]:["","composer"];
  if(base==="performer")return sub?["performer","performer / "+lab(GROUPS,sub)]:["","performer"];
  if(base==="projects")return["","projects"];
  if(base==="events")return sub?["events","events / "+sub]:["","performances & events"];
  if(h==="contact")return["","contact"];
  if(base==="w"){const w=WORKS.find(x=>x.s===sub);return w?["composer-"+w.cat,"composer / "+lab(CATS,w.cat)]:["",""]}
  if(base==="p"){const a=ACTS.find(x=>x.s===sub);if(!a)return["",""];return a.g==="arranging"?["composer-arranging","composer / arrangements & orchestration"]:["performer-"+a.g,"performer / "+lab(GROUPS,a.g)]}
  if(base==="j")return["projects","projects"];
  return null;
}
function route(){
  let h=location.hash.slice(1);
  const lb=h.split("-")[0];if(LEGACY[lb]){location.replace("#"+h.replace(lb,LEGACY[lb]));return}
  const MOVED={"p-red-on-gold":"j-red-on-gold","p-flux":"j-flux","j-corpus-terrestre":"j-dance"};
  if(MOVED[h]){location.replace("#"+MOVED[h]);return}
  setDD(false);if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".nav"))document.activeElement.blur();
  closeMenu(true);
  let r="home",sec="";
  const [base,sub]=h.split(/-(.+)/);
  if(base==="about"&&(!sub||["awards","teaching"].includes(sub))){r="about";sec="about";renderAbout(sub)}
  else if(base==="composer"&&(!sub||CATS.some(c=>c[0]===sub))){r="composer";sec="composer";renderComposer(sub)}
  else if(base==="performer"&&(!sub||GROUPS.some(g=>g[0]===sub))){r="performer";sec="performer";renderPerformer(sub)}
  else if(h==="projects"){r="projects";sec="projects";renderProjects()}
  else if(base==="events"&&(!sub||["upcoming","past"].includes(sub))){r="events";sec="events";renderEvents(sub)}
  else if(h==="contact"){r="contact";sec="contact";renderContact()}
  else if(base==="w"&&WORKS.find(w=>w.s===sub)){r="work";sec="composer";renderDetail(WORKS.find(w=>w.s===sub),"work")}
  else if(base==="p"&&ACTS.find(a=>a.s===sub)){const a=ACTS.find(x=>x.s===sub);r="act";sec=a.g==="arranging"?"composer":"performer";renderDetail(a,"act")}
  else if(base==="j"&&PROJECTS.find(p=>p.s===sub)){r="project";sec="projects";renderProject(PROJECTS.find(p=>p.s===sub))}
  else {h="";renderHome()}
  if(NAVSTACK[NAVSTACK.length-2]===h)NAVSTACK.pop();else if(NAVSTACK[NAVSTACK.length-1]!==h)NAVSTACK.push(h);
  const par=r==="home"?null:parentOf(h),pg=view.querySelector(".page");
  if(par&&pg){pg.insertAdjacentHTML("afterbegin",`<div class="backbar"><button class="back" id="back" type="button"><span aria-hidden="true">←</span> home</button><span class="path">${par[1]}</span></div>`);
    document.getElementById("back").addEventListener("click",()=>{location.hash="#"})}
  if(r!=="home")pagePalette(sec);
  document.body.dataset.route=r;document.body.dataset.look=r==="home"?"home":"page";markNav(sec);setBarH();if(r==="home")placeHome();
  const t=view.querySelector("h1");
  document.title=t&&r!=="home"?plain(t.innerHTML).replace(/&amp;/g,"&")+" · Saurabh Shivakumar":"Saurabh Shivakumar";
  window.scrollTo(0,0);
}

/* ---------- phone menu ---------- */
const menu=document.getElementById("menu"),openBtn=document.getElementById("menu-open");
function openMenu(){menu.hidden=false;openBtn.setAttribute("aria-expanded","true");document.body.style.overflow="hidden";document.getElementById("menu-close").focus()}
function closeMenu(silent){if(menu.hidden)return;menu.hidden=true;openBtn.setAttribute("aria-expanded","false");document.body.style.overflow="";if(!silent)openBtn.focus()}
openBtn.addEventListener("click",openMenu);
document.getElementById("menu-close").addEventListener("click",()=>closeMenu());
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
menu.addEventListener("click",e=>{const a=e.target.closest("a[href^='#']");if(a&&a.getAttribute("href")===(location.hash||"#"))closeMenu(true)});

Object.values(FILM).flat().forEach(loadImg);
addEventListener("hashchange",route);
route();

</script>
